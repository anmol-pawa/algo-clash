 border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">S3</span><span class="block font-display text-base text-[var(--gold)]">Splitting text</span><span class="block text-sm opacity-80">Cut a line into fields with find and substr, or with getline over a stringstream, and know what happens at the edges.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">S4</span><span class="block font-display text-base text-[var(--gold)]">Structs, constructors and ordering</span><span class="block text-sm opacity-80">A struct bundles fields; a constructor with an initialiser list sets them up; operator&lt; teaches sort how to order your type.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">S4</span><span class="block font-display text-base text-[var(--gold)]">Linked lists as LeetCode gives them</span><span class="block text-sm opacity-80">ListNode, nullptr, walking with a pointer, the dummy head, and why interview code uses new and does not free.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">S4</span><span class="block font-display text-base text-[var(--gold)]">TreeNode and class Solution</span><span class="block text-sm opacity-80">TreeNode with two child pointers, the null base case, and the class Solution wrapper with its public section.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">R1</span><span class="block font-display text-base text-[var(--gold)]">Reading the cost of code</span><span class="block text-sm opacity-80">Count loops, drop constants, add sequential steps and multiply nested ones. Know what amortised means.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">R1</span><span class="block font-display text-base text-[var(--gold)]">Constraints and recurrences</span><span class="block text-sm opacity-80">Turn the input limits into the complexity you can afford, and solve divide-and-conquer recurrences with the master theorem.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">R2</span><span class="block font-display text-base text-[var(--gold)]">Hash lookup: have I seen it before?</span><span class="block text-sm opacity-80">Trade memory for time: store what you have seen in an unordered_map or unordered_set and answer pair, duplicate and grouping questions in one pass.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">R2</span><span class="block font-display text-base text-[var(--gold)]">Two pointers: let order do the work</span><span class="block text-sm opacity-80">On sorted input or in-place rewriting, two indices that only move forward replace a nested loop with a single pass.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">R2</span><span class="block font-display text-base text-[var(--gold)]">Prefix sums, difference arrays and Kadane</span><span class="block text-sm opacity-80">Precompute running totals so any range sum is a subtraction, turn range updates into two point updates, and find the best subarray in one pass.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">R3</span><span class="block font-display text-base text-[var(--gold)]">Sliding window: grow, shrink, never look back</span><span class="block text-sm opacity-80">A contiguous stretch with a rule becomes one pass: a right edge that only grows, a left edge that only follows, and a running summary of what is inside.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">R3</span><span class="block font-display text-base text-[var(--gold)]">Monotonic deque: the window&#x27;s champion</span><span class="block text-sm opacity-80">Keep candidates in a deque that stays sorted, so the best value in the window is always at the front and each index is pushed and popped once.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">R4</span><span class="block font-display text-base text-[var(--gold)]">Inside the hash table: buckets, load and rehash</span><span class="block text-sm opacity-80">A hash map is an array of buckets plus a function that picks one. Knowing where it stays fast and where it quietly degrades is what lets you trust it in a loop.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">R4</span><span class="block font-display text-base text-[var(--gold)]">Designing keys: what should equal what?</span><span class="block text-sm opacity-80">Most hash-map problems are won or lost in the key. Choose a key so that two things are equal exactly when the problem says they are the same.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li><li><button class="panel flex min-h-16 w-full items-center justify-between gap-3 p-3 text-left" disabled=""><span><span class="block font-display text-[10px] uppercase tracking-wider opacity-60">R4</span><span class="block font-display text-base text-[var(--gold)]">Rolling hash: fingerprints that slide</span><span class="block text-sm opacity-80">Turn a window of text into a number you can update in O(1). Compare numbers instead of strings, verify the rare match, and binary search on length for the hard problems.</span></span><span class="shrink-0 rounded border px-2 py-1 font-display text-[10px] uppercase border-white/20 bg-black/30">New</span></button></li></ul></div></main><!--$--><!--/$--><div class="pointer-events-none fixed right-2 top-[max(0.5rem,env(safe-area-inset-top))] z-50 flex flex-col items-end gap-2"><button type="button" class="px-btn pointer-events-auto flex min-h-11 min-w-11 items-center justify-center text-lg" aria-label="Sound on. Open sound settings" aria-expanded="false"><span aria-hidden="true">🔊</span></button></div><script id="_R_">(globalThis["TURBOPACK"] || (globalThis["TURBOPACK"] = [])).push({"otherChunks":["static/chunks/1x6obpmlu1_c2.js","static/chunks/2r4s4h5xul1n-.js","static/chunks/3wbm-994r45kr.js","static/chunks/142viqhcxinuc.js"],"runtimeModuleIds":[94553]});</script><script src="/algo-clash/_next/static/chunks/1x6obpmlu1_c2.js" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:\"/algo-clash/_next/static/chunks/38_6cr69j2-5o.js\"\n3:I[39756,[\"$2\"],\"default\"]\n4:I[37457,[\"$2\"],\"default\"]\n5:\"/algo-clash/_next/static/chunks/2n5qeheznvl4u.js\"\n6:I[22016,[\"$2\",\"$5\"],\"\"]\n7:I[64576,[\"$2\"],\"PwaRegister\"]\n8:I[670,[\"$2\"],\"AudioDock\"]\nc:\"/algo-clash/_n
